# Datadog Synthetic tests are optional. The application build and deployment do not depend on Datadog.
# Add DD_API_KEY and DD_APP_KEY repository secrets to enable the external check.
name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  datadog:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Datadog Synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ env.DD_API_KEY }}
          app_key: ${{ env.DD_APP_KEY }}
          test_search_query: "tag:e2e-tests"
      - name: Explain optional check
        if: ${{ env.DD_API_KEY == '' || env.DD_APP_KEY == '' }}
        run: echo "Datadog Synthetic tests skipped because DD_API_KEY/DD_APP_KEY are not configured. This does not block the application build or deployment."

name: Refresh AI opportunity archive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh official feeds
        run: node scripts/refresh-archive.mjs
      - name: Commit updated feed
        run: |
          git config user.name "ai100-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add client/src/lib/archiveFeed.ts
          git diff --cached --quiet || git commit -m "chore: refresh official AI archive feed"
          git push
